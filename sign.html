<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Buyer Agreement · Julián J. Crider</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#111;--ink2:#3a3a3c;--muted:#6e6e73;--hair:#e5e5e7;--red:#d13438;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.top{background:#000;color:#fff;padding:16px;font-weight:700;font-size:17px}
.top i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:14px}
.draft{background:#fff4f4;border:1px solid #f1c4c5;color:#8a1c1f;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.doc h1{font-size:21px;line-height:1.25;letter-spacing:-.01em;margin-bottom:12px}
.doc h2{font-size:15px;margin:16px 0 4px}
.doc p{color:var(--ink2);font-size:15px}
.doc a{color:inherit}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:10px 0;color:var(--ink2)}
label.chk input{width:20px;height:20px;margin-top:2px;accent-color:#000;flex:0 0 auto}
.field{margin:14px 0}
.field span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--hair);border-radius:12px;background:#fff}
.pad{position:relative;border:1px dashed #b9b9bf;border-radius:12px;background:#fff;touch-action:none}
canvas{display:block;width:100%;height:170px;border-radius:12px;cursor:crosshair}
.pad .hint{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none}
.pad button{position:absolute;right:8px;top:8px;font:inherit;font-size:13px;border:0;background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer}
.go{display:block;width:100%;font:inherit;font-weight:700;font-size:17px;padding:15px;border:0;border-radius:999px;background:#000;color:#fff;cursor:pointer;margin-top:16px}
.go[disabled]{opacity:.5;cursor:default}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:1.2em}
.done{text-align:center;padding:30px 10px}
.done .dot{width:56px;height:56px;border-radius:50%;background:#000;margin:0 auto 14px;display:grid;place-items:center}
.done .dot::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--red)}
.done h2{font-size:22px;margin-bottom:6px}
.fine{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="top">Julián J. Crider<i></i></div>
<div class="wrap" id="app"><div class="card"><p>Loading your agreement…</p></div></div>
<script>
// Same Apps Script endpoint the main site uses (see SHEET_URL in index.html).
const API = 'https://script.google.com/macros/s/AKfycbzqOjOSjwfZynEC6uNUlhoewr9k34HKZhIfzKaUBScpcoZKHEQykJQJyEW7d9tETkK7/exec';
const app = document.getElementById('app');
const id = new URLSearchParams(location.search).get('id') || '';
const msg = (title, text) => { app.innerHTML = `<div class="card done"><div class="dot"></div><h2>${title}</h2><p>${text}</p></div>`; };

fetch(API + '?action=agreement&id=' + encodeURIComponent(id))
  .then(r => r.json())
  .then(a => {
    if (!a.ok) return msg('Link not valid', a.error || 'Please contact Julián at 702-498-2571.');
    if (a.status === 'Signed') return msg('Already signed', 'This agreement has been signed. Your copy was emailed to you.');
    render(a);
  })
  .catch(() => msg('Something went wrong', 'Please refresh the page, or contact Julián at 702-498-2571.'));

function render(a) {
  app.innerHTML = `${a.live ? '' : '<div class="draft"><b>Draft for broker review.</b> This page is not in use with buyers yet.</div>'}
    <div class="card doc">${a.html}</div>
    <div class="card doc">${a.duties}</div>
    <div class="card">
      <p style="font-weight:600;margin-bottom:6px">Duties Owed: in the future, the licensee…</p>
      <label class="chk"><input type="radio" name="dual" value="MAY"> <span><b>MAY</b> act for two or more parties who have interests adverse to each other (only with a signed Consent to Act).</span></label>
      <label class="chk"><input type="radio" name="dual" value="MAY NOT"> <span><b>MAY NOT</b> act for two or more parties who have interests adverse to each other.</span></label>
      <hr style="border:0;border-top:1px solid var(--hair);margin:12px 0">
      <label class="chk"><input type="checkbox" id="c1"> I have read the buyer agreement.</label>
      <label class="chk"><input type="checkbox" id="c3"> I acknowledge receipt of a copy of the Duties Owed disclosure, and have read and understand it.</label>
      <label class="chk"><input type="checkbox" id="c2"> I agree to sign electronically, and that my electronic signature is legally binding.</label>
      <div class="field"><span>Type your full name</span><input type="text" id="nm" autocomplete="name" value=""></div>
      <div class="field"><span>Sign below</span>
        <div class="pad"><canvas id="cv"></canvas><span class="hint">Sign with your finger or mouse</span><button type="button" id="clr">Clear</button></div></div>
      <button class="go" id="go">Sign agreement</button>
      <p class="err" id="err"></p>
      <p class="fine">You'll get a signed copy by email right away.</p>
    </div>`;
  document.getElementById('nm').value = a.buyer || '';
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  let drawing = false, drawn = false;
  const size = () => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.4; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; drawn = false; };
  size(); window.addEventListener('resize', size);
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', e => { document.getElementById('err').textContent = ''; drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pt(e)); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; ctx.lineTo(...pt(e)); ctx.stroke(); drawn = true; });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
  document.getElementById('clr').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); drawn = false; };
  document.getElementById('go').onclick = () => {
    const err = document.getElementById('err'), name = document.getElementById('nm').value.trim();
    const dual = (document.querySelector('input[name=dual]:checked') || {}).value;
    if (!dual) return err.textContent = 'Please choose MAY or MAY NOT on the Duties Owed form.';
    if (!['c1','c2','c3'].every(k => document.getElementById(k).checked)) return err.textContent = 'Please check all three boxes.';
    if (name.length < 2) return err.textContent = 'Please type your full name.';
    if (!drawn) return err.textContent = 'Please sign in the box.';
    err.textContent = ''; const btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Signing…';
    fetch(API, {method: 'POST', body: JSON.stringify({action: 'signAgreement', id, typedName: name, consent: true, signature: cv.toDataURL('image/png'), dualAgency: dual, dutiesAck: true, ua: navigator.userAgent})})
      .then(r => r.json())
      .then(res => {
        if (res.ok) return msg('Signed. Thank you!', 'A signed copy is on its way to your email. Julián will confirm your showing time.');
        btn.disabled = false; btn.textContent = 'Sign agreement'; err.textContent = res.error || 'Something went wrong. Please try again.';
      })
      .catch(() => { btn.disabled = false; btn.textContent = 'Sign agreement'; err.textContent = 'Could not reach the server. Please try again.'; });
  };
}
</script>
</body>
</html>
